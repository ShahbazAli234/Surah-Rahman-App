name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and Locate Project
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;
          if [ ! -f "settings.gradle.kts" ]; then
            SETTINGS_PATH=$(find . -name "settings.gradle.kts" | head -n 1)
            if [ -n "$SETTINGS_PATH" ]; then
              DIR=$(dirname "$SETTINGS_PATH")
              echo "Moving files from $DIR to root..."
              cp -r "$DIR"/* .
            fi
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle and Create Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Downloading Gradle..."
            curl -sLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            /tmp/gradle-8.11.1/bin/gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Surah-Ar-Rahman-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
